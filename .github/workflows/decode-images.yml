name: Build catalog images
on:
  push:
    branches: [main]
    paths:
      - 'payload.tsv'

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode product images
        shell: bash
        run: |
          mkdir -p images
          while IFS=$'\t' read -r sku data; do
            [ -z "$sku" ] && continue
            printf '%s' "$data" | base64 --decode > "images/${sku}.jpg"
          done < payload.tsv
      - name: Commit generated images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "Build DECOPLANTS catalog images"
            git push
          fi
